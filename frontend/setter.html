<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Setter Portal</title>

<link rel="stylesheet" href="css/style.css">

<style>
.result-card{
display:none;
margin-top:25px;
}

.result-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-top:18px;
}

.result-item{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);
border-radius:16px;
padding:20px;
text-align:center;
}

.result-item h2{
font-size:32px;
margin-bottom:10px;
}

.hash-text{
font-size:13px;
word-break:break-all;
color:#93c5fd;
}
</style>

</head>

<body>

<div class="topbar">

<div class="logo">Secure Cloud QPMS</div>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="container">

<div class="hero">

<div>
<h1>Question Setter Portal</h1>
<p>Create encrypted examination question papers securely.</p>
</div>

<div class="glow"></div>

</div>

<div class="card">

<h3>Create Question Paper</h3>

<input
id="title"
type="text"
placeholder="Paper Title"
required>

<textarea
id="content"
rows="8"
placeholder="Enter Question Paper"
required></textarea>

<button onclick="createPaper()">
Create Question Paper
</button>

</div>

<div id="resultCard" class="card result-card">

<h3>Paper Created Successfully</h3>

<div class="result-grid">

<div class="result-item">

<h2 id="paperIdDisplay">-</h2>

<p>Generated Paper ID</p>

</div>

<div class="result-item">

<p class="hash-text" id="hashDisplay">-</p>

<p>SHA-256 Integrity Hash</p>

</div>

</div>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/setter.js"></script>

</body>
</html>
